[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "standalone-inspace"
version = "0.1.0"
description = "InSpace Standalone Inference Engine: sm_75 Dev & sm_120 Blackwell Production"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }
authors = [
    { name = "InSpace Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    # Core CLI & Web UI
    "click>=8.1.7",
    "gradio==6.0.1",
    "huggingface_hub>=0.24.0",

    # Scientific & Numerical Core
    "numpy>=1.26.0,<2.2.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.5",
    "easydict>=1.13",
    "zstandard>=0.23.0",
    "safetensors>=0.4.5",
    "filelock>=3.15.4",
    "requests>=2.32.3",

    # 2D & 3D Vision, Geometry & Rendering
    "Pillow>=10.4.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "imageio>=2.35.0",
    "imageio-ffmpeg>=0.5.1",
    "scikit-image>=0.24.0",
    "trimesh>=4.4.0",
    "plyfile>=1.0.3",
    "py360convert>=1.0.0",
    "kornia>=0.7.3",
    "timm>=1.0.0",
    "transformers>=4.40.0",
    "matplotlib>=3.9.0",
    "plotly>=5.24.0",
    "lpips>=0.1.4",

    # 3D Utilities (Vendored local source copy)
    "utils3d",

    # PyTorch stack + attention
    "torch",
    "torchvision",
    "xformers",

    # Custom Universal CUDA extensions
    "cumesh",
    "flex-gemm",
    "nvdiffrast",
    "o-voxel",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
inspace = "app:main"

# PyTorch CUDA 12.8 index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
xformers = { index = "pytorch-cu128" }
cumesh = { path = "wheels/cumesh-0.0.1-cp310-cp310-linux_x86_64.whl" }
flex-gemm = { path = "wheels/flex_gemm-1.0.0-cp310-cp310-linux_x86_64.whl" }
nvdiffrast = { path = "wheels/nvdiffrast-0.4.0-cp310-cp310-linux_x86_64.whl" }
o-voxel = { path = "wheels/o_voxel-0.0.1-cp310-cp310-linux_x86_64.whl" }
flash-attn = { path = "wheels/flash_attn-2.8.3+cu128sm120-cp310-cp310-linux_x86_64.whl" }
utils3d = { path = "third_party/utils3d" }

[tool.setuptools.packages.find]
where = ["inspace"]
include = ["trellis2*", "demo*", "configs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "inspace"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: fast unit tests not requiring GPU or heavy weights",
    "gpu: tests requiring CUDA device",
    "checkpoints: tests requiring downloaded model weights",
]


